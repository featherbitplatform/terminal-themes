description = "Dark syntax theme from the Atom editor. The palette has no terminal colors; fbterm's mapping: black is the selection color, bright black is mono-3, white and bright white are mono-1 (the text color), and red, green, yellow, blue, magenta and cyan are hue-5, hue-4, hue-6-2, hue-2, hue-3 and hue-1 in both normal and bright. Cursor and selection are the theme's own."
