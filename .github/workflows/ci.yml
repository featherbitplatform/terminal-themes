name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 -m unittest discover -s tools
      - name: Validate themes and catalog
        run: python3 tools/catalog.py check
      - name: Versions grow and ids stay
        if: github.event_name == 'pull_request'
        run: python3 tools/catalog.py versions origin/${{ github.base_ref }}
